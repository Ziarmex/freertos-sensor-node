name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests (sensor_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make -C host_tests test

  # Static analysis of the application sources. The STM32 HAL/FreeRTOS trees are
  # generated by CubeMX, so this job cannot link; cppcheck parses the sources
  # without needing those headers. Non-blocking because missing vendor headers
  # can surface as advisory findings.
  cppcheck:
    name: Static analysis (cppcheck, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            --inline-suppr -I Core/Inc -I components/sensor_core/include \
            Core/Src 2> cppcheck.txt || true
          cat cppcheck.txt
